- assertVisible: "Maestro premium task"
- tapOn: "Maestro premium task"
- assertVisible: "Task details"
- tapOn: "Edit task"
- tapOn: "Done"
- tapOn: "Save changes"
- assertVisible: "Done"
- tapOn: "Delete task"
- tapOn: "Delete task"
