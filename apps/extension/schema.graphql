"""Create a task in an organization the caller belongs to."""
input CreateTask {
  assigneeId: String
  description: String
  dueDate: LocalDate
  image: File
  labelIds: [String!]
  organizationId: String!
  priority: TaskPriority
  status: TaskStatus
  title: String!
}

"""Create a reusable label in an organization."""
input CreateTaskLabel {
  color: String!
  name: String!
  organizationId: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

"""Delete an organization the caller belongs to."""
input DeleteOrganization {
  organizationId: String!
}

"""Delete a task in an organization the caller belongs to."""
input DeleteTask {
  taskId: String!
}

"""Delete an organization task label."""
input DeleteTaskLabel {
  labelId: String!
}

"""Delete the current authenticated user account."""
input DeleteUser {
  callbackURL: String
  password: String
  token: String
}

"""The `File` scalar type represents a file upload."""
scalar File

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

"""A calendar date without a time zone, serialized in YYYY-MM-DD format."""
scalar LocalDate

type Mutation {
  createTask(input: CreateTask!): Task
  createTaskLabel(input: CreateTaskLabel!): TaskLabel
  deleteOrganization(input: DeleteOrganization!): String
  deleteTask(input: DeleteTask!): String
  deleteTaskLabel(input: DeleteTaskLabel!): String
  deleteUser(input: DeleteUser!): String
  updateOrganization(input: UpdateOrganization!): Organization
  updateTask(input: UpdateTask!): Task
  updateTaskLabel(input: UpdateTaskLabel!): TaskLabel
  updateUser(input: UpdateUser!): User
}

"""Organization model"""
type Organization {
  createdAt: DateTime!
  id: ID!
  imageFull: String
  imageThumb: String
  logo: String
  metadata: String
  name: String!
  slug: String!
}

type Query {
  health: String

  """Get an organization by id"""
  organization(id: ID!): Organization

  """List organizations for the authenticated user"""
  organizations: [Organization!]!

  """Get a task by id"""
  task(id: ID!): Task

  """List tasks using an opaque cursor and deterministic ordering."""
  taskConnection(after: String, assigneeId: String, createdFrom: DateTime, createdTo: DateTime, dueFrom: LocalDate, dueTo: LocalDate, first: Int, labelIds: [String!], organizationId: ID!, priorities: [TaskPriority!], search: String, sort: TaskSort, statuses: [TaskStatus!]): TaskConnection!
  taskLabels(organizationId: ID!): [TaskLabel!]!
  taskSummary(organizationId: ID!): TaskSummary!

  """List tasks for an organization the caller belongs to"""
  tasks(assigneeId: String, createdFrom: DateTime, createdTo: DateTime, dueFrom: LocalDate, dueTo: LocalDate, labelIds: [String!], organizationId: ID!, priorities: [TaskPriority!], search: String, sort: TaskSort, statuses: [TaskStatus!]): [Task!]!

  """Get a user by id"""
  user(id: ID!): User
}

"""Task model"""
type Task {
  assignee: User
  assigneeId: String
  createdAt: DateTime!
  createdById: String!
  description: String
  dueDate: LocalDate
  id: ID!
  imageFull: String
  imageThumb: String
  labels: [TaskLabel!]!
  organizationId: String!
  priority: TaskPriority!
  status: TaskStatus!
  title: String!
  updatedAt: DateTime!
}

type TaskConnection {
  nodes: [Task!]!
  pageInfo: TaskPageInfo!
}

"""A reusable organization-scoped task label."""
type TaskLabel {
  color: String!
  createdAt: DateTime!
  id: ID!
  name: String!
  organizationId: String!
}

type TaskPageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

enum TaskPriority {
  HIGH
  LOW
  MEDIUM
  NONE
}

enum TaskSort {
  DUE_DATE
  NEWEST
  PRIORITY
  RECENTLY_UPDATED
}

enum TaskStatus {
  DONE
  IN_PROGRESS
  TODO
}

type TaskSummary {
  done: Int!
  inProgress: Int!
  overdue: Int!
  todo: Int!
  total: Int!
}

"""
A field whose value conforms to the standard URL format as specified in RFC3986: https://www.ietf.org/rfc/rfc3986.txt.
"""
scalar URL

"""Update an organization the caller belongs to."""
input UpdateOrganization {
  logo: File
  name: String
  organizationId: String!
  slug: String
}

"""Update a task in an organization the caller belongs to."""
input UpdateTask {
  assigneeId: String
  description: String
  dueDate: LocalDate
  image: File
  labelIds: [String!]
  priority: TaskPriority
  removeImage: Boolean
  status: TaskStatus
  taskId: String!
  title: String
}

"""Update an organization task label."""
input UpdateTaskLabel {
  color: String
  labelId: String!
  name: String
}

"""Update the current authenticated user profile."""
input UpdateUser {
  avatar: File
  name: String
}

"""Authenticated user model"""
type User {
  createdAt: DateTime!
  email: String!
  emailVerified: Boolean!
  id: ID!
  imageFull: String
  imagePlaceholder: String
  imageThumb: String
  name: String!
  updatedAt: DateTime!
}