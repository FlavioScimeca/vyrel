name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset:
    name: Verify changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Verify changeset when public packages change
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if echo "$PR_LABELS" | grep -q '"skip-changeset"'; then
            echo "skip-changeset label found — check skipped"
            exit 0
          fi

          public_changes=$(
            git diff --name-only "origin/${BASE_REF}...HEAD" -- 'packages/public/' \
              | grep -Ev '\.(test|spec)\.(ts|tsx)$' \
              || true
          )

          if [ -z "$public_changes" ]; then
            echo "No publishable package changes — changeset not required"
            exit 0
          fi

          echo "Public package changes detected:"
          echo "$public_changes"

          changeset_changes=$(
            git diff --name-only "origin/${BASE_REF}...HEAD" -- '.changeset/' \
              | grep -E '\.md$' \
              | grep -v README.md \
              || true
          )

          if [ -n "$changeset_changes" ]; then
            echo "Changeset found:"
            echo "$changeset_changes"
            exit 0
          fi

          echo "::error::This PR changes packages under packages/public/ but has no changeset. Run \`bun run changeset\` and commit the file in .changeset/, or add the \`skip-changeset\` label."
          exit 1

  # Quality gate is local: `bun run preflight` (husky pre-push).
  # Expand this job later (lint, types, tests, etc.) without rewiring the workflow.
  checks:
    name: Checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Placeholder
        run: |
          echo "CI checks placeholder — quality gate runs locally via bun run preflight."
          echo "Add remote checks here when ready."
