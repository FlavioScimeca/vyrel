name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset:
    name: Verify changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Verify changeset when public packages change
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if echo "$PR_LABELS" | grep -q '"skip-changeset"'; then
            echo "skip-changeset label found — check skipped"
            exit 0
          fi

          public_changes=$(
            git diff --name-only "origin/${BASE_REF}...HEAD" -- 'packages/public/' \
              | grep -Ev '\.(test|spec)\.(ts|tsx)$' \
              || true
          )

          if [ -z "$public_changes" ]; then
            echo "No publishable package changes — changeset not required"
            exit 0
          fi

          echo "Public package changes detected:"
          echo "$public_changes"

          changeset_changes=$(
            git diff --name-only "origin/${BASE_REF}...HEAD" -- '.changeset/' \
              | grep -E '\.md$' \
              | grep -v README.md \
              || true
          )

          if [ -n "$changeset_changes" ]; then
            echo "Changeset found:"
            echo "$changeset_changes"
            exit 0
          fi

          echo "::error::This PR changes packages under packages/public/ but has no changeset. Run \`bun run changeset\` and commit the file in .changeset/, or add the \`skip-changeset\` label."
          exit 1

  preflight:
    name: Preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      HUSKY: "0"
      BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-32chars
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_AUTH_TOKEN: ci-placeholder-database-auth-token
      DATABASE_URL: file::memory:?cache=shared
      LOG_LEVEL: info
      NODE_ENV: test
      R2_ACCESS_KEY_ID: ci-placeholder-r2-access-key-id
      R2_ACCOUNT_ID: ci-placeholder-r2-account-id
      R2_BUCKET_NAME: ci-placeholder-r2-bucket
      R2_SECRET_ACCESS_KEY: ci-placeholder-r2-secret-access-key
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      RESEND_API_KEY: ci-placeholder-resend-api-key
      RESEND_FROM_EMAIL: ci@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preflight
        run: bun run preflight
