name: Require Changeset

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: require-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-changeset:
    name: Require changeset for public packages
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify changeset when public packages change
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if echo "$PR_LABELS" | grep -q '"skip-changeset"'; then
            echo "skip-changeset label found — check skipped"
            exit 0
          fi

          public_changes=$(
            git diff --name-only "origin/${BASE_REF}...HEAD" -- 'packages/public/' \
              | grep -Ev '\.(test|spec)\.(ts|tsx)$' \
              || true
          )

          if [ -z "$public_changes" ]; then
            echo "No publishable package changes — changeset not required"
            exit 0
          fi

          echo "Public package changes detected:"
          echo "$public_changes"

          changeset_changes=$(
            git diff --name-only "origin/${BASE_REF}...HEAD" -- '.changeset/' \
              | grep -E '\.md$' \
              | grep -v README.md \
              || true
          )

          if [ -n "$changeset_changes" ]; then
            echo "Changeset found:"
            echo "$changeset_changes"
            exit 0
          fi

          echo "::error::This PR changes packages under packages/public/ but has no changeset. Run \`bun run changeset\` and commit the file in .changeset/, or add the \`skip-changeset\` label."
          exit 1
