name: Release

on:
  push:
    branches:
      - main
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  should_release:
    name: Check release conditions
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Decide whether release should run
        id: check
        run: |
          has_pending_changesets() {
            find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .
          }

          is_version_packages_commit() {
            git log -1 --pretty=%s "$1" 2>/dev/null | grep -qE '^chore: version packages$'
          }

          if has_pending_changesets; then
            echo "Pending changesets found — will create or update version PR"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if is_version_packages_commit HEAD; then
            echo "Version packages commit — will publish to npm"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse --verify HEAD^2 >/dev/null 2>&1 && is_version_packages_commit HEAD^2; then
            echo "Version packages merge commit — will publish to npm"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for package_json in packages/public/*/package.json; do
            name=$(jq -r '.name' "$package_json")
            version=$(jq -r '.version' "$package_json")
            published=$(npm view "$name" version 2>/dev/null || true)

            if [ -n "$published" ] && [ "$version" != "$published" ]; then
              echo "Unpublished version detected for $name ($version vs npm $published) — will publish"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No changesets and not a version-packages commit — release skipped"
          echo "run=false" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: should_release
    if: needs.should_release.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          title: "chore: version packages"
          commit: "chore: version packages"
